include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Output of freezed and json_serializable.
    - "**/*.freezed.dart"
    - "**/*.g.dart"
  errors:
    # Freezed puts @JsonKey on constructor parameters on purpose.
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    # The generated providers are untyped top-level finals.
    specify_nonobvious_property_types: false
