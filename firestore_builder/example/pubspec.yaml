name: example
description: Example app for firestore_builder. Compiles the generated code.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore: ^6.8.0
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.15.1
  firestore_builder:
    path: ..
  freezed: ^3.0.0
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
